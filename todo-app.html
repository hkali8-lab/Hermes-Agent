<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#211f1c; --muted:#8a877f;
  --line:#e4e1d8; --accent:#256e52; --on-accent:#ffffff;
  --danger:#b3402f; --shadow:0 1px 2px rgba(30,28,24,.05);
  --radius:12px; --speed:150ms;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101113; --surface:#1a1c1f; --ink:#e9e8e4; --muted:#8f8d86;
    --line:#2c2e33; --accent:#4fb98a; --on-accent:#0c1210;
    --danger:#e07a6a; --shadow:0 1px 2px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

.app{max-width:36rem; margin:0 auto; padding:48px 20px 96px}

.topline{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px}
h1{font-size:1.5rem; font-weight:700; letter-spacing:-.01em; margin:0}
.meta{color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; white-space:nowrap}

form.new{display:flex; gap:8px; margin-bottom:20px}
form.new input{
  flex:1; min-width:0; min-height:48px; padding:12px 14px;
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); transition:border-color var(--speed) ease;
}
form.new input::placeholder{color:var(--muted)}
form.new input:focus{border-color:var(--accent); outline:none}
form.new button{
  min-height:48px; padding:0 18px; font:inherit; font-weight:600;
  color:var(--on-accent); background:var(--accent);
  border:none; border-radius:var(--radius); cursor:pointer;
  transition:filter var(--speed) ease;
}
form.new button:hover{filter:brightness(1.08)}
form.new button:active{filter:brightness(.95)}

ul.list{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.item{
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  transition:opacity var(--speed) ease, transform var(--speed) ease, border-color var(--speed) ease;
}
.item.entering{opacity:0; transform:translateY(4px)}
.item.removing{opacity:0; transform:translateX(8px)}
.item:hover{border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}

.check{
  flex:none; width:22px; height:22px; padding:0; cursor:pointer;
  display:grid; place-items:center;
  background:transparent; border:2px solid var(--line); border-radius:7px;
  transition:background var(--speed) ease, border-color var(--speed) ease, transform var(--speed) ease;
}
.check:hover{border-color:var(--accent); transform:scale(1.06)}
.check svg{width:14px; height:14px}
.check path{
  fill:none; stroke:var(--on-accent); stroke-width:3; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:20; stroke-dashoffset:20;
  transition:stroke-dashoffset 200ms ease 40ms;
}
.item.done .check{background:var(--accent); border-color:var(--accent)}
.item.done .check path{stroke-dashoffset:0}

.label{
  flex:1; min-width:0; overflow-wrap:anywhere;
  transition:color var(--speed) ease;
}
.item.done .label{color:var(--muted); text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--muted) 60%, transparent)}

.del{
  flex:none; width:36px; height:36px; margin:-2px; padding:0; cursor:pointer;
  display:grid; place-items:center;
  background:transparent; border:none; border-radius:8px;
  color:var(--muted); font-size:20px; line-height:1;
  transition:color var(--speed) ease, background var(--speed) ease;
}
.del:hover{color:var(--danger); background:color-mix(in srgb, var(--danger) 10%, transparent)}

.empty{
  margin:28px 0 0; padding:24px 0; text-align:center;
  color:var(--muted); font-size:.95rem; border-top:1px dashed var(--line);
}

@media (max-width:480px){
  .app{padding-top:28px}
  form.new button{padding:0 14px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important; animation:none !important}
}
</style>
</head>
<body>
<main class="app">
  <header class="topline">
    <h1>To-do</h1>
    <p class="meta" id="meta" aria-live="polite"></p>
  </header>

  <form class="new" id="form">
    <input id="input" type="text" placeholder="Add a task" autocomplete="off" aria-label="New task">
    <button type="submit">Add</button>
  </form>

  <ul class="list" id="list" role="list"></ul>
  <p class="empty" id="empty" hidden>No tasks yet. Add your first one above.</p>
</main>

<script>
(() => {
  const KEY = 'todo-app.items.v1';
  const list = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const metaEl = document.getElementById('meta');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let items = load();

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
      return (Array.isArray(raw) ? raw : [])
        .filter(x => x && typeof x.text === 'string' && x.text.trim())
        .map(x => ({ id: String(x.id || uid()), text: x.text, done: !!x.done }));
    } catch { return []; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  }

  function render() {
    list.innerHTML = '';
    for (const it of items) list.appendChild(li(it));
    updateMeta();
  }

  function li(it) {
    const el = document.createElement('li');
    el.className = 'item' + (it.done ? ' done' : '');
    el.dataset.id = it.id;

    const check = document.createElement('button');
    check.className = 'check';
    check.dataset.action = 'toggle';
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', String(it.done));
    check.setAttribute('aria-label', 'Mark "' + it.text + '" as ' + (it.done ? 'not done' : 'done'));
    check.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5 8 14.5 16 5.5"/></svg>';

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = it.text;

    const del = document.createElement('button');
    del.className = 'del';
    del.dataset.action = 'delete';
    del.setAttribute('aria-label', 'Delete "' + it.text + '"');
    del.textContent = '\u00d7';

    el.append(check, label, del);
    return el;
  }

  function updateMeta() {
    const total = items.length, done = items.filter(i => i.done).length;
    if (!total) { metaEl.textContent = ''; emptyEl.hidden = false; return; }
    emptyEl.hidden = true;
    metaEl.textContent = done === total
      ? 'All ' + total + ' done'
      : (total - done) + ' of ' + total + ' remaining';
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const it = { id: uid(), text, done: false };
    items.push(it); save();
    input.value = ''; input.focus();
    const el = li(it);
    el.classList.add('entering');
    list.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('entering')));
    emptyEl.hidden = true; updateMeta();
  });

  list.addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const item = btn.closest('li.item');
    const it = items.find(x => x.id === item.dataset.id);
    if (!it) return;

    if (btn.dataset.action === 'toggle') {
      it.done = !it.done; save();
      item.classList.toggle('done', it.done);
      btn.setAttribute('aria-checked', String(it.done));
      btn.setAttribute('aria-label', 'Mark "' + it.text + '" as ' + (it.done ? 'not done' : 'done'));
      updateMeta();
    } else if (btn.dataset.action === 'delete') {
      items = items.filter(x => x.id !== it.id); save();
      item.classList.add('removing');
      setTimeout(() => { item.remove(); updateMeta(); }, reduceMotion ? 0 : 170);
      if (items.length === 0) emptyEl.hidden = false;
    }
  });

  render();
})();
</script>
</body>
</html>
